name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Icono y manifiesto
        run: go run ./tools/mkrsrc -o rsrc_windows_amd64.syso assets/icon-256.png assets/icon-64.png assets/icon-48.png assets/icon-32.png assets/icon-16.png

      - name: Compilar para Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o PuenteEdenSwitch.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: PuenteEdenSwitch
          path: PuenteEdenSwitch.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PuenteEdenSwitch.exe
          generate_release_notes: true
